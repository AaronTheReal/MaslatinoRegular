@if (variant() === 'compacto') {
  <button
    type="button"
    class="share-chip"
    (click)="compartir()"
    [attr.aria-label]="nativeSupported() ? 'Compartir esta noticia' : 'Copiar el enlace de esta noticia'"
  >
    <svg class="share-chip__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M18 16.08a2.9 2.9 0 0 0-1.96.77L8.91 12.7a3.3 3.3 0 0 0 0-1.4l7.05-4.11A2.99 2.99 0 1 0 15 5c0 .24.04.47.09.7L8.04 9.81a3 3 0 1 0 0 4.38l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 1 0 2.92-2.92Z"
      />
    </svg>
    <span>{{ copiado() ? 'Enlace copiado' : 'Compartir' }}</span>
  </button>
} @else {
  <section class="share-bar" aria-labelledby="share-bar-title">
    <h2 class="share-bar__title" id="share-bar-title">Comparte esta noticia</h2>

    <div class="share-bar__actions">
      <!-- Solo aparece donde el sistema tiene hoja de compartir: en escritorio
           sobran los botones de abajo. -->
      @if (nativeSupported()) {
        <button type="button" class="share-btn share-btn--native" (click)="compartir()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18 16.08a2.9 2.9 0 0 0-1.96.77L8.91 12.7a3.3 3.3 0 0 0 0-1.4l7.05-4.11A2.99 2.99 0 1 0 15 5c0 .24.04.47.09.7L8.04 9.81a3 3 0 1 0 0 4.38l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 1 0 2.92-2.92Z"
            />
          </svg>
          <span>Compartir</span>
        </button>
      }

      <!-- Enlaces de verdad (<a href>), no botones: funcionan aunque el JS
           no haya cargado y se pueden abrir en otra pestaña. -->
      <a
        class="share-btn share-btn--whatsapp"
        [href]="whatsappUrl()"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"
          />
        </svg>
        <span>WhatsApp</span>
      </a>

      <a
        class="share-btn share-btn--facebook"
        [href]="facebookUrl()"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M22 12a10 10 0 10-11.6 9.9v-7H8v-3h2.4V9.5c0-2.4 1.4-3.8 3.6-3.8 1 0 2 .2 2 .2v2.3h-1.1c-1.1 0-1.4.7-1.4 1.4V12H18l-.4 3h-2.6v7A10 10 0 0022 12z"
          />
        </svg>
        <span>Facebook</span>
      </a>

      <a class="share-btn share-btn--x" [href]="xUrl()" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
          />
        </svg>
        <span>X</span>
      </a>

      <button type="button" class="share-btn share-btn--copy" (click)="copiarEnlace()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12ZM8 13h8v-2H8v2Zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10Z"
          />
        </svg>
        <span>{{ copiado() ? 'Enlace copiado' : 'Copiar enlace' }}</span>
      </button>
    </div>

    <!-- El aviso se anuncia también para quien usa lector de pantalla: el
         cambio de texto del botón por sí solo no siempre se lee. -->
    <span class="share-bar__status" role="status" aria-live="polite">
      {{ copiado() ? 'Enlace copiado al portapapeles' : '' }}
    </span>
  </section>
}
