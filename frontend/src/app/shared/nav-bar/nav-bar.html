<!-- Floating actions: se muestran solo si showFloatingActions === true
     y hideFloatingActionsOnPodcastDetail === false -->
<div class="floating-icons" *ngIf="showFloatingActions && !hideFloatingActionsOnPodcastDetail">

  <img
    src="assets/iconosnavbar/lupa.png"
    alt="Buscar"
    class="lupa"
    role="button"
    tabindex="0"
    (click)="onSearchClick($event)"
    (keydown.enter)="onSearchClick($event)"
  />

  <!-- Botón hamburguesa accesible.
       Sin (keydown.enter): un <button> nativo ya dispara (click) con Enter y
       el listener extra abría y cerraba el menú en la misma pulsación.
       Es un botón que despliega una navegación (aria-expanded + aria-controls),
       no un menú de aplicación: por eso no lleva aria-haspopup. -->
  <button
    class="hamburger-btn"
    [attr.aria-label]="isMenuOpen ? 'Cerrar menú' : 'Abrir menú'"
    [attr.aria-expanded]="isMenuOpen"
    aria-controls="nav-quick-menu"
    (click)="toggleMenu($event)"
  >
    <svg class="sabor" width="37" height="32" viewBox="0 0 37 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M34 32H3C1.343 32 0 30.657 0 29C0 27.343 1.343 26 3 26H34C35.657 26 37 27.343 37 29C37 30.657 35.657 32 34 32Z" fill="black"/>
      <path d="M34 19H3C1.343 19 0 17.657 0 16C0 14.343 1.343 13 3 13H34C35.657 13 37 14.343 37 16C37 17.657 35.657 19 34 19Z" fill="black"/>
      <path d="M34 6H3C1.343 6 0 4.657 0 3C0 1.343 1.343 0 3 0H34C35.657 0 37 1.343 37 3C37 4.657 35.657 6 34 6Z" fill="black"/>
    </svg>
  </button>
</div>

<!-- Panel desplegable (anclado a la derecha).
     Es la navegación del sitio: <nav> con listas de enlaces normales. Antes
     llevaba role="menu"/"menuitem", que es para menús de aplicación y además
     estaba mal anidado (Lighthouse, 04/10/2026). -->
<nav
  id="nav-quick-menu"
  class="menu-panel"
  [class.open]="isMenuOpen"
  aria-label="Menú del sitio"
  (click)="onPanelClick($event)"
  *ngIf="showFloatingActions && !hideFloatingActionsOnPodcastDetail"
>
  <div class="menu-section">
    <div class="menu-title">Navegación</div>
    <ul class="menu-list">
      <li>
        <a [routerLink]="['/nosotros-pagina']">Quienes somos</a>
      </li>
      <li>
        <a [routerLink]="['/podcast-show']" >Podcasts</a>
      </li>
      <li>
        <a [routerLink]="['/noticias-todas']" >Noticias</a>
      </li>
      <li>
        <a [routerLink]="['/eventos-show']" >Eventos</a>
      </li>
      <li>
        <a [routerLink]="['/cities']" >Ciudades</a>
      </li>
    </ul>
  </div>

  <div class="menu-section">
    <div class="menu-title">Productos</div>
    <ul class="menu-list">
      <li>
        <a href="https://maslatinonetwork.com">Más Latino Network</a>
      </li>
      <li>
        <a href="https://www.youtube.com/@Mas.Latino" target="_blank" rel="noopener">Morning show</a>
      </li>
      <li>
        <a [routerLink]="['/contactanos']" >Contáctanos</a>
      </li>
    </ul>
  </div>
</nav>

<!-- Nav -->
<nav class="navbar">
  <div class="navbar-center">
    <img src="assets/iconosnavbar/maslatinologo.png" [routerLink]="['/']" alt="Logo Más Latino" class="logo" />
  </div>
</nav>
